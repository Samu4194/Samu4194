
name: Generar serpiente

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Crear serpiente animada
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Samu4194
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=cyan

      - name: Publicar animacion
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
